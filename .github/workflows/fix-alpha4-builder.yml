name: Fix alpha4 builder

on:
  push:
    branches:
      - work/0.9.0-alpha.4

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/0.9.0-alpha.4
          fetch-depth: 0
      - name: Fix replacement count
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/build-alpha4-pa.yml')
          text = path.read_text(encoding='utf-8')
          old = "              label='new capability PA fields',\n          )"
          new = "              expected=2,\n              label='new capability PA fields',\n          )"
          if text.count(old) != 1:
              raise SystemExit(f'expected one target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/fix-alpha4-builder.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows
          git commit -m 'Fix alpha4 build replacement count'
          git push origin HEAD:work/0.9.0-alpha.4
