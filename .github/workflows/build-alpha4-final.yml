name: Build alpha4 final

on:
  push:
    branches:
      - work/0.9.0-alpha.4

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/0.9.0-alpha.4
          fetch-depth: 0

      - name: Apply alpha4 source changes
        run: python tools/apply_alpha4_pa.py

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile EventideSharedProfiles/*.py
          python - <<'PY'
          from pathlib import Path
          import json
          py = Path('EventideSharedProfiles/EventideSharedProfiles.py').read_text(encoding='utf-8')
          qml = Path('EventideSharedProfiles/qml/EventideSharedProfilesWindow.qml').read_text(encoding='utf-8')
          plugin = json.loads(Path('EventideSharedProfiles/plugin.json').read_text(encoding='utf-8'))
          checks = {
              'plugin version': plugin.get('version') == '0.9.0-alpha.4',
              'python version': 'PLUGIN_VERSION = "0.9.0-alpha.4"' in py,
              'PA stored': 'tuning["pressure_advance"] = pressure_advance' in py,
              'PA not stripped': 'tuning.pop("pressure_advance", None)' not in py,
              'PA start injection': 'SET_PRESSURE_ADVANCE ADVANCE={:g} ; Eventide Shared Profiles' in py,
              'QML PA field': 'id: pressureAdvance' in qml,
              'QML PA toggle': 'id: klipperPa' in qml,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Static checks failed: ' + ', '.join(failed))
          print('Static checks passed:', ', '.join(checks))
          PY

      - name: Package alpha4
        shell: bash
        run: |
          set -euo pipefail
          zip -qr EventideSharedProfiles-v0.9.0-alpha.4.zip EventideSharedProfiles -x '*/__pycache__/*' '*.pyc'
          sha256sum EventideSharedProfiles-v0.9.0-alpha.4.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EventideSharedProfiles-v0.9.0-alpha.4
          path: EventideSharedProfiles-v0.9.0-alpha.4.zip
          if-no-files-found: error

      - name: Commit alpha4 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EventideSharedProfiles
          git commit -m 'Add Pressure Advance capability in v0.9.0-alpha.4'
          git push origin HEAD:work/0.9.0-alpha.4
