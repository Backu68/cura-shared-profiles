name: Eventide 0.8.6 release materializer

on:
  push:
    branches: [main]
    paths:
      - '.eventide-release/**'
      - '.github/workflows/eventide-release-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize v0.8.6 source
        shell: bash
        run: |
          set -euo pipefail
          cat .eventide-release/part* > /tmp/eventide.b64
          base64 -d /tmp/eventide.b64 > /tmp/eventide.tar.xz
          rm -rf /tmp/eventide-release
          mkdir -p /tmp/eventide-release
          tar -xJf /tmp/eventide.tar.xz -C /tmp/eventide-release
          rm -rf EventideSharedProfiles
          cp -a /tmp/eventide-release/EventideSharedProfiles ./EventideSharedProfiles
          cp EventideSharedProfiles/README.md README.md
          cp EventideSharedProfiles/CHANGELOG.md CHANGELOG.md
          cp EventideSharedProfiles/TESTING.md TESTING.md
          rm -rf .eventide-release
          rm -f .github/workflows/eventide-release-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v0.8.6 beta"
          git push origin HEAD:main
