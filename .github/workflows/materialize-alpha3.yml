name: Materialize alpha3 source

on:
  push:
    branches:
      - work/0.9.0-alpha.4

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/0.9.0-alpha.4
          fetch-depth: 0

      - name: Reconstruct canonical alpha3 ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat parts/*.b64 | base64 --decode > /tmp/EventideSharedProfiles-v0.9.0-alpha.3.zip
          echo 'e87b8c98e7c89fa0457ba89dadfe5b6094816fe7bb3dc05cac0df300c5bf6a03  /tmp/EventideSharedProfiles-v0.9.0-alpha.3.zip' | sha256sum -c -
          rm -rf /tmp/alpha3
          mkdir -p /tmp/alpha3
          unzip -q /tmp/EventideSharedProfiles-v0.9.0-alpha.3.zip -d /tmp/alpha3

      - name: Materialize exact source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf EventideSharedProfiles
          cp -a /tmp/alpha3/EventideSharedProfiles ./EventideSharedProfiles
          rm -rf parts
          rm -f README.md
          rm -f .github/workflows/materialize-alpha3.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit canonical alpha3 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize canonical v0.9.0-alpha.3 source' || exit 0
          git push origin HEAD:work/0.9.0-alpha.4
