name: Temporary Eventide v0.8.0 source bootstrap

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  expand:
    if: github.head_ref == 'bootstrap-v0.8.0-beta'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout payload branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Reconstruct exact plugin tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/eventide080.part* | base64 -d > /tmp/eventide080.tar.gz
          git checkout -B expanded-v0.8.0-beta ${{ github.event.pull_request.base.sha }}
          rm -rf EventideSharedProfiles .bootstrap .github
          tar -xzf /tmp/eventide080.tar.gz
          cp EventideSharedProfiles/README.md README.md
          cp EventideSharedProfiles/CHANGELOG.md CHANGELOG.md
          cp EventideSharedProfiles/TESTING.md TESTING.md
          printf '__pycache__/\n*.pyc\n' > .gitignore
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Expanded v0.8.0 beta source'
          git push --force origin expanded-v0.8.0-beta
